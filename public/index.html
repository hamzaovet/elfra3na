<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>كابتن برجر | Captain Burger</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F5EBDC;
      color: #502314;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Cairo", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .logo-container {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      background: #FAF3E8;
      box-shadow: 0 10px 25px rgba(80, 35, 20, 0.15);
      border: 3px solid #FFAE00;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      color: #502314;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      font-weight: 700;
      color: #D62300;
      margin-bottom: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(80, 35, 20, 0.15);
      border-top-color: #D62300;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="كابتن برجر" class="logo-img">
  </div>
  <h1>كابتن برجر - Captain BRGR</h1>
  <p>أشهى برجر لحم بلدي ودجاج كرسبي 🍔🔥</p>
  <div class="spinner"></div>

  <script>
    // Redirect to production web app or localhost for live dev
    const targetUrl = window.location.hostname === "localhost" 
      ? "http://localhost:3000" 
      : "https://captain-burger-five.vercel.app/";
    window.location.replace(targetUrl);
  </script>
</body>
</html>
